<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽象語の感情価・覚醒価評定</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Single light theme on purpose: every participant sees the same white screen regardless of OS dark mode.
   Layout: one centered task stage; word on top, 9-point scale, next button below */
:root {
  --bg: #ffffff;
  --fg: #1d1f24;
  --muted: #6a6f7a;
  --line: #dfe2e8;
  --cell: #f6f7f9;
  --cell-hover: #eceef2;
  --selected: #c8323c;
  --selected-fg: #ffffff;
  --accent: #c8323c;
  --disabled: #e6e7eb;
  --disabled-fg: #a0a4ad;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
:root { color-scheme: light; }
html, body { min-height: 100%; }
body {
  /* jsPsych が body に width:100% を付けるので、左右の余白を幅の内側に含める（スマホで横にはみ出さないように） */
  box-sizing: border-box;
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* jsPsych は表示領域に height:100% を付けるが、長い説明文がはみ出してスクロールやタップが不安定になるため、高さは内容に合わせる */
.jspsych-display-element { height: auto !important; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.jspsych-content-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 32px; }
.jspsych-content { width: 100%; max-width: 900px; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 56px; text-align: center; }
.word { font-family: var(--font-body); font-size: clamp(56px, 11vw, 88px); font-weight: 500; letter-spacing: 0.04em; line-height: 1.2; }
.word.catch { font-size: clamp(20px, 4vw, 28px); font-weight: 500; letter-spacing: 0.02em; min-height: 2.4em; display: flex; align-items: center; text-wrap: balance; }
.dim-label { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
.scale { display: grid; grid-template-columns: auto auto auto; grid-template-areas: "l p r"; justify-content: center; align-items: center; gap: 16px; max-width: 100%; }
.anchor { font-size: 14px; color: var(--muted); white-space: nowrap; }
.anchor.left { grid-area: l; text-align: right; }
.anchor.right { grid-area: r; text-align: left; }
.points { grid-area: p; display: grid; grid-template-columns: repeat(9, 56px); gap: 6px; }
.pt {
  font: inherit; font-size: 17px; font-variant-numeric: tabular-nums;
  height: 48px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--cell); color: var(--fg); cursor: pointer; transition: background .12s;
}
.pt:hover { background: var(--cell-hover); }
.pt[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--selected-fg); }
.pt:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  font: inherit; font-size: 15px; padding: 10px 36px; border: 0; border-radius: 6px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.btn:disabled { background: var(--disabled); color: var(--disabled-fg); cursor: default; }
.bar { width: min(320px, 100%); height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--muted); }
.keyhint { font-size: 12px; color: var(--muted); margin-top: -40px; }
.progress { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.text { max-width: 36em; margin-inline: auto; text-align: left; line-height: 1.9; font-size: 16px; display: flex; flex-direction: column; gap: 14px; }
.text h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
.text p { margin: 0; }
.text h2 { font-size: 18px; margin: 14px 0 0; }
.text ul { margin: 0; padding-left: 1.4em; }
.kit { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.kit img { width: 100%; max-width: 480px; border-radius: 8px; border: 1px solid var(--line); }
.kit figcaption { font-size: 14px; color: var(--muted); line-height: 1.7; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--cell); }
.steps .st { font-size: 14px; color: var(--muted); }
.steps .ex { font-weight: 700; }
@media (max-width: 520px) { .steps li { grid-template-columns: 1fr; gap: 2px; } }
.checks { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input, .radio input { width: 18px; height: 18px; margin: 5px 0 0; accent-color: var(--accent); }
.q { border: 0; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 2px; }
.q legend { font-weight: 700; padding: 0; margin-bottom: 6px; }
.radio { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 4px; cursor: pointer; border-radius: 6px; }
.radio:hover, .check:hover { background: var(--cell); }
.numrow { display: flex; align-items: center; gap: 8px; }
.numrow input { font: inherit; width: 5em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums; }
.numrow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.text .center { text-align: center; margin-top: 16px; }

.result { width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.result pre { max-height: 320px; overflow: auto; background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 12px; margin: 0; }

@media (max-width: 860px) {
  .scale { grid-template-columns: 1fr 1fr; grid-template-areas: "p p" "l r"; gap: 10px; width: 100%; }
  .points { grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
  .pt { height: 44px; font-size: 15px; padding: 0; }
  .anchor { font-size: 12px; }
  .anchor.left { text-align: left; }
  .anchor.right { text-align: right; }
  .stage { gap: 40px; }
}
@media (prefers-reduced-motion: reduce) { .pt { transition: none; } }
</style>

</head>

/* ============================================================
   設定
   ============================================================ */
const CONFIG = {
  // DataPipe の Experiment ID。空のままならデモモード（データは送信せず画面に表示）
  DATAPIPE_ID: "PzyHPVZzJgEh",
  // 感情価・覚醒価で同じ単語リストを使用
  WORDS: `原理 局面 動向 論点 因果 便宜 概念 論理 比重 抽象 措置 道理 形式 学説 本質 方式 比率 観念 名目 要因
要素 様式 妥当 是非 定義 手法 理論 対比 程度 趣旨 見解 前提 構造 典型 形態 関連 尺度 事態 作用 相違
事例 数量 必然 区分 特性 意義 頻度 仮定 上限 文脈 根拠 性質 現象 機能 過程 分類 中立 領域 恩義 美徳
良識 博愛 尊厳 敬愛 寛容 自負 連帯 慈悲 功績 品格 向上 忠誠 誠意 虚偽 悪徳 懸念 悲観 不正 惨事 過失
中傷 無情 憤慨`.split(/\s+/).filter(Boolean),
  // 研究の説明文（同意画面の前に表示）。【　】は未確定の箇所
  INFO: `<h1>研究へのご協力のお願い</h1>
    <p><strong>研究課題名</strong>：抽象語の感情価・覚醒度に関する評定調査<br>
    <strong>研究実施者</strong>：東北大学大学院医学系研究科　加齢医学研究所 人間脳科学研究分野　博士後期課程4年　髙橋一也<br>
    <strong>指導教員</strong>：東北大学大学院医学系研究科　加齢医学研究所 人間脳科学研究分野　杉浦 元亮</p>
    <h2>1. 研究の目的</h2>
    <p>この研究では、さまざまな言葉が人に与える印象を調べています。今回の調査では、抽象的な意味をもつ言葉について、「快・不快の感じ」と「気持ちの高ぶりの強さ」を評定していただきます。得られたデータは、言葉の意味と記憶の関係を調べる研究の基礎資料として使用します。</p>
    <h2>2. 参加いただける方</h2>
    <p>18歳以上で、日本語を母語とする方を対象としています。</p>
    <h2>3. 調査の内容と所要時間</h2>
    <p>最初に、年齢・性別・母語・利き手についての簡単な質問にお答えいただきます。その後、3つのパートで、画面に表示される言葉について1〜9の9段階で評定していただきます。最後のパートでは、言葉をレゴブロックで表すとしたらどれくらい難しそうかを答えていただきます（実際に組み立てる必要はありません）。所要時間は全体で10分程度です。</p>
    <p>できるだけPCまたはスマートフォンをご利用いただき、静かな環境で回答してください。</p>
    <h2>4. 参加は自由です</h2>
    <p>この調査への参加は、あなたの自由な意思によるものです。参加しないことを選んでも、不利益を受けることは一切ありません。回答の途中でも、ブラウザのタブを閉じることで、理由を述べずにいつでも参加を取りやめることができます。途中で取りやめた場合、それまでの回答の一部が保存されることがありますが、【その回答は分析に使用しません】。</p>
    <h2>5. 匿名性について</h2>
    <p>この調査では、氏名・メールアドレス・所属など、あなたを特定できる情報は一切収集しません。回答はランダムな番号で管理されます。そのため、回答を送信した後に、ご自身の回答を撤回・削除することはできません。あらかじめご了承ください。</p>
    <h2>6. データの管理</h2>
    <p>回答データは、研究実施者のみがアクセスできるオンラインの保管場所（Google ドライブ。米国の Google 社が運営）に保存します。データは【東北大学の規程に従い、研究終了後〇年間】保管した後、適切に廃棄します。【研究成果の発表後、個人が特定できない形でデータを公開することがあります。】</p>
    <h2>7. 予想される負担と不利益</h2>
    <p>10分程度の時間をいただくこと以外に、大きな負担は想定していません。ただし、評定する言葉の中には、ネガティブな意味をもつ言葉も一部含まれます。不快に感じた場合は、いつでも回答を中止してかまいません。</p>
    <h2>8. 謝礼</h2>
    <p>【謝礼はありません。】</p>
    <h2>9. 研究成果の公表</h2>
    <p>研究の成果は、博士論文、学会発表、学術論文として公表する予定です。公表の際に、個人が特定されることはありません。</p>
    <h2>10. 倫理審査</h2>
    <p>この研究は、【東北大学応用認知神経科学センター MRI研究倫理委員会】の承認を得て実施しています（承認番号：【〇〇〇〇】）。</p>
    <h2>11. お問い合わせ</h2>
    <p>この研究についてご質問がある場合は、下記までご連絡ください。<br>
    研究実施者：髙橋一也<br>
    メール：【takahashi.kazuya.s4@dc.tohoku.ac.jp】</p>
    <p>以上の説明をお読みいただき、参加に同意いただける場合は、「次へ」を押して同意画面に進んでください。</p>`,
  // 同意項目（Gorillaの英語版を日本語化）
  CONSENT_ITEMS: [

  },

/* 作りやすさのパートの教示（写真と作例つき） */
function buildInstruction() {
  return `
    <p>最後に、それぞれの言葉を<strong>レゴブロックで表すとしたら、どれくらい難しそうか</strong>を答えていただきます。</p>
    <p><strong>実際にブロックを組み立てる必要はありません。</strong>頭の中で想像するだけで大丈夫です。</p>

    <h2>使えるブロック</h2>
    <figure class="kit"><img src="${CONFIG.KIT_PHOTO}" alt="基本的な形のレゴブロック約20個。四角いブロック、細長い板、土台の板、棒、羽根、はしごなど"><figcaption>この写真のブロック（約20個）だけを使うと考えてください。人形や家など、決まった形の部品はありません。</figcaption></figure>

    <h2>言葉をブロックで表すには</h2>
    <p>「協力」のような抽象的な言葉は、そのままでは形にできません。次の3つのステップで考えると、ブロックで表せるようになります。</p>
    <ol class="steps">
      <li><span class="st">① 言葉を見る</span><span class="ex">協力</span></li>
      <li><span class="st">② その言葉が当てはまる、具体的な場面を1つ思い浮かべる</span><span class="ex">何人かで、重い荷物をいっしょに持ち上げている場面</span></li>
      <li><span class="st">③ 場面の中の「もの」と、そのつながり方をブロックで作る</span><span class="ex">1枚の板を、何本もの柱で下からいっしょに支える形</span></li>
    </ol>
    <p>もう1つの例です。</p>
    <ol class="steps">
      <li><span class="st">① 言葉</span><span class="ex">安定</span></li>
      <li><span class="st">② 場面</span><span class="ex">広い土台の上に、物が倒れずにどっしり乗っている場面</span></li>
      <li><span class="st">③ ブロック</span><span class="ex">大きな板の上に、低く横に広げて積んだ、倒れにくい形</span></li>
    </ol>
    <p><strong>見た目をそっくりにする必要はありません。</strong>大切なのは、言葉の中にある「関係」（支える、つながる、くらべる、など）を形にできるかどうかです。</p>

    <h2>答え方</h2>
    <p>それぞれの言葉について、「<strong>写真のブロックを使って、90秒ほどで表すとしたら、どれくらい難しそうか</strong>」を、下の9段階から1つ選んでください。</p>
    <ul>
      <li>左端（<strong>1</strong>）＝ とても簡単（場面も形も、すぐに思い浮かぶ）</li>
      <li>中央（<strong>5</strong>）＝ どちらともいえない</li>
      <li>右端（<strong>9</strong>）＝ とても難しい（場面も形も、なかなか思い浮かばない）</li>
    </ul>
    <p><strong>数値が大きいほど難しい</strong>ことになります。中間の数字も選べます。</p>
    <p>ブロック遊びの経験や、手先の器用さは関係ありません。「<strong>場面と形が、どれくらい思い浮かびやすいか</strong>」だけで判断してください。</p>
    <p>正解・不正解はありません。<strong>直感で、できるだけ速く</strong>答えてください。</p>`;
}

/* ============================================================
   参加者ID（完全匿名のため、参加者には入力させず内部で自動生成する）
   ============================================================ */
const params = new URLSearchParams(location.search);
const participantId = "anon_" + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
const demoMode = !CONFIG.DATAPIPE_ID;

/* 端末の種類（スマホ / タブレット / PC）
   ブラウザが教えてくれる情報（userAgentData・UA文字列・タッチ点数・画面サイズ）から判定する */
const DEVICE = (() => {
  const ua = navigator.userAgent;
  const touchPoints = navigator.maxTouchPoints || 0;
  const coarse = matchMedia("(pointer: coarse)").matches;
  const uadMobile = navigator.userAgentData ? navigator.userAgentData.mobile : null;
  const shortSide = Math.min(screen.width, screen.height);
  let type = "pc";
  if (uadMobile === true || /iPhone|iPod/.test(ua) || (/Android/.test(ua) && /Mobile/.test(ua))) type = "smartphone";
  else if (/iPad/.test(ua) || (/Macintosh/.test(ua) && touchPoints > 1) || (/Android/.test(ua) && !/Mobile/.test(ua))) type = "tablet";
  else if (coarse && shortSide < 500) type = "smartphone";
  return { type, touchPoints, coarse };
})();

/* ============================================================
   評定試行のカスタムプラグイン（選択 →「次へ」で確定）
   ============================================================ */
class RatingPlugin {
  static info = {
    name: "word-rating",
    version: "1.0.0",
    parameters: {
      word: { type: jsPsychModule.ParameterType.STRING, default: "" },
      dimension: { type: jsPsychModule.ParameterType.STRING, default: "valence" },
      progress: { type: jsPsychModule.ParameterType.FLOAT, default: 0 },
      isCatch: { type: jsPsychModule.ParameterType.BOOL, default: false },
      isPractice: { type: jsPsychModule.ParameterType.BOOL, default: false }
    },
    data: {}
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el, trial) {
    const d = CONFIG.DIMENSIONS[trial.dimension];
    const pts = Array.from({ length: 9 }, (_, i) =>
      `<button class="pt" type="button" id="pt${i + 1}" data-v="${i + 1}" aria-pressed="false">${i + 1}</button>`).join("");
    el.innerHTML = `
      <div class="stage">
        <div class="dim-label">${trial.isPractice ? "練習　" : ""}${d.name}</div>
        <div class="word${trial.isCatch ? " catch" : ""}">${trial.word}</div>
        <div class="scale">
          <span class="anchor left">${d.left}</span>
          <div class="points" role="group" aria-label="${d.name} 1〜9">${pts}</div>
          <span class="anchor right">${d.right}</span>
        </div>
        <button class="btn" id="next" type="button" disabled>次へ</button>
        ${DEVICE.type === "pc" ? `<div class="keyhint">キーボードの 1〜9 でも選べます。Enter で次へ進みます。</div>` : ""}
        <div class="bar" ${trial.isPractice ? "hidden" : ""} role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(trial.progress * 100)}"><span style="width:${(trial.progress * 100).toFixed(1)}%"></span></div>
      </div>`;
    // --- 時間の起点：単語が実際に画面に描かれたフレームにそろえる ---
    // innerHTML を入れた直後はまだ描画されていない。次のフレームの描画タイミング（rAF）を起点にする
    const tScript = performance.now();
    let t0 = tScript, onsetDelay = null;
    requestAnimationFrame(() => { t0 = performance.now(); onsetDelay = Math.round(t0 - tScript); });

    let rating = null, firstRt = null, firstInput = null, changes = 0, done = false;
    const nextBtn = el.querySelector("#next");
    const choose = (v, input) => {
      if (done) return;
      const now = performance.now();
      if (firstRt === null) { firstRt = Math.round(now - t0); firstInput = input; }
      else if (v !== rating) changes++;
      rating = v;
      el.querySelectorAll(".pt").forEach(x => x.setAttribute("aria-pressed", Number(x.dataset.v) === v ? "true" : "false"));
      nextBtn.disabled = false;
    };
    const submit = (input) => {
      if (done || rating === null) return;
      done = true;
      document.removeEventListener("keydown", onKey);
      this.jsPsych.finishTrial({
        word: trial.word,
        dimension: trial.dimension,
        rating,
        rt_first_choice: firstRt,
        rt_submit: Math.round(performance.now() - t0),
        n_changes: changes,
        first_choice_input: firstInput,   // keyboard / mouse / touch / pen
        submit_input: input,
        onset_delay_ms: onsetDelay        // 処理から実際の描画までのずれ（参考値）
      });
    };
    // マウス・タッチ・ペン：直前の pointerdown の pointerType で判別する。
    // iPhone（Safari・LINEなど）は click イベントの pointerType を "mouse" と報告するため、click 側の値は使わない。
    // キーボードでボタンを押した場合は detail=0
    let lastPointer = null;
    el.addEventListener("pointerdown", e => { lastPointer = e.pointerType || null; }, true);
    const inputOf = e => (e.detail === 0 ? "keyboard" : (lastPointer || (DEVICE.coarse ? "touch" : "mouse")));
    el.querySelectorAll(".pt").forEach(b => b.addEventListener("click", e => choose(Number(b.dataset.v), inputOf(e))));
    nextBtn.addEventListener("click", e => submit(inputOf(e)));
    // キーボード：数字キー（上段・テンキー）で選択、Enter で次へ。日本語入力がオンでも効くよう e.code で判定
    const onKey = e => {
      if (e.repeat) return;
      const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
      if (m) { e.preventDefault(); choose(Number(m[1]), "keyboard"); }
      else if (e.key === "Enter") { e.preventDefault(); submit("keyboard"); }
    };
    document.addEventListener("keydown", onKey);
  }
}

/* 文章を出してボタンで進むだけの画面 */
class TextPlugin {
  static info = {
    name: "text-screen",
    version: "1.0.0",
    parameters: {
      html: { type: jsPsychModule.ParameterType.HTML_STRING, default: "" },
      button: { type: jsPsychModule.ParameterType.STRING, default: "次へ" }
    },
    data: {}
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el, trial) {
    el.innerHTML = `<div class="text">${trial.html}
      <div class="center"><button class="btn" id="go" type="button">${trial.button}</button></div></div>`;
    el.querySelector("#go").addEventListener("click", () => {
      this.jsPsych.finishTrial({});
    });
  }
}

/* 同意画面：3項目すべてにチェックすると「次へ」が押せる */
class ConsentPlugin {
  static info = { name: "consent", version: "1.0.0", parameters: {}, data: {} };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el) {
    const items = CONFIG.CONSENT_ITEMS.map((t, i) => `
      <label class="check" for="c${i}"><input type="checkbox" id="c${i}"><span>${t}</span></label>`).join("");
    el.innerHTML = `<div class="text">
      <h1>研究参加への同意</h1>
      <p>以下の各項目をよく読み、該当するものすべてにチェックを入れてください。</p>
      <div class="checks">${items}</div>
      <div class="center"><button class="btn" id="go" type="button" disabled>次へ</button></div></div>`;
    const boxes = [...el.querySelectorAll("input[type=checkbox]")];
    const go = el.querySelector("#go");
    boxes.forEach(b => b.addEventListener("change", () => { go.disabled = !boxes.every(x => x.checked); }));
    go.addEventListener("click", () => {
      const t = new Date().toISOString();
      this.jsPsych.data.addProperties({ consent: true, consent_time: t });
      this.jsPsych.finishTrial({ task: "consent" });
    });
  }
}

/* 参加者情報のアンケート：すべて回答すると「次へ」が押せる */
class SurveyPlugin {
  static info = { name: "demographics", version: "1.0.0", parameters: {}, data: {} };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(el) {
    const qs = CONFIG.SURVEY.map(q => q.type === "number" ? `
      <fieldset class="q"><legend><label for="${q.id}">${q.label}</label></legend>
        <div class="numrow"><input id="${q.id}" name="${q.id}" type="text" inputmode="numeric" autocomplete="off" maxlength="3"><span>歳</span></div>
        <p class="hint" id="${q.id}_msg">数字で入力してください。</p>
      </fieldset>` : `
      <fieldset class="q"><legend>${q.label}</legend>
        ${q.options.map((o, i) => `<label class="radio" for="${q.id}${i}">
          <input type="radio" name="${q.id}" id="${q.id}${i}" value="${o}"><span>${o}</span></label>`).join("")}
      </fieldset>`).join("");
    el.innerHTML = `<div class="text"><h1>あなたについて</h1>
      <p>以下の質問にお答えください。</p>${qs}
      <div class="center"><button class="btn" id="go" type="button" disabled>次へ</button></div></div>`;
    const go = el.querySelector("#go");
    // 全角数字も受け付ける
    const toNum = v => { const t = String(v || "").trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); return /^\d{1,3}$/.test(t) ? Number(t) : NaN; };
    const answers = () => Object.fromEntries(CONFIG.SURVEY.map(q => [q.id, q.type === "number"
      ? toNum(el.querySelector(`#${q.id}`).value)
      : (el.querySelector(`input[name="${q.id}"]:checked`) || {}).value]));
    const check = () => {
      const a = answers();
      let ok = true;
      CONFIG.SURVEY.forEach(q => {
        if (q.type === "number") {
          const v = a[q.id], msg = el.querySelector(`#${q.id}_msg`);
          const valid = Number.isInteger(v) && v >= q.min && v <= q.max;
          msg.textContent = el.querySelector(`#${q.id}`).value === "" ? "数字で入力してください。"
            : valid ? "" : `${q.min}〜${q.max}の数字で入力してください。`;
          if (!valid) ok = false;
        } else if (!a[q.id]) ok = false;
      });
      go.disabled = !ok;
    };
    el.addEventListener("input", check);
    el.addEventListener("change", check);
    go.addEventListener("click", () => {
      const a = answers();
      // 対象年齢未満の場合は、データを保存せずに終了する
      if (a.age < CONFIG.MIN_AGE) {
        this.jsPsych.abortExperiment(`<div class="text"><h1>ご関心をお寄せいただき、ありがとうございました</h1>
          <p>この調査は${CONFIG.MIN_AGE}歳以上の方を対象としています。申し訳ありませんが、ご参加いただくことができません。</p>
          <p>このウィンドウを閉じてください。</p></div>`);
        return;
      }
      this.jsPsych.data.addProperties(a);
      this.jsPsych.finishTrial({ task: "demographics" });
    });
  }
}

/* ============================================================
   実験の組み立て
   ============================================================ */
const jsPsych = initJsPsych({});
/* カウンターバランス（同一URLで配布）
   1) URLに ?order=VA / ?order=AV があればそれに従う（手動で指定したいとき用）
   2) なければ DataPipe の条件割り当て機能で、開いた人に順番に 0,1,0,1… を割り当てる（Gorillaの balanced と同じ考え方）
   3) デモモード、または通信に失敗したときはランダム */
const ORDERS = { VA: ["valence", "arousal"], AV: ["arousal", "valence"] };
let order = { code: "VA", list: "A", source: "pending" };
async function assignOrder() {
  const q = (params.get("order") || "").toUpperCase();
  const ql = (params.get("list") || "").toUpperCase();
  const pickList = () => (ql === "A" || ql === "B") ? ql : (Math.random() < 0.5 ? "A" : "B");
  if (ORDERS[q]) return { code: q, list: pickList(), source: "url" };
  if (!demoMode) {
    try {
      const res = await fetch("https://pipe.jspsych.org/api/condition/", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "*/*" },
        body: JSON.stringify({ experimentID: CONFIG.DATAPIPE_ID })
      });
      const c = Number((await res.json()).condition);
      // DataPipe の条件数は 4 に設定する：0=VA・A, 1=AV・A, 2=VA・B, 3=AV・B
      // （順序は偶数/奇数、リストは 0,1 → A / 2,3 → B。条件数が2のままだとリストが常にAになるので注意）
      if (Number.isInteger(c) && c >= 0) return {
        code: c % 2 === 0 ? "VA" : "AV", list: Math.floor(c / 2) % 2 === 0 ? "A" : "B", source: "datapipe_balanced" };
    } catch (e) { /* ランダムにフォールバック */ }
  }
  return { code: Math.random() < 0.5 ? "VA" : "AV", list: pickList(), source: "random" };
}
jsPsych.data.addProperties({
  participant_id: participantId,
  start_time: new Date().toISOString(),
  screen_w: screen.width,
  screen_h: screen.height,
  window_w: innerWidth,
  window_h: innerHeight,
  touch_device: DEVICE.coarse,
  device_type: DEVICE.type,
  max_touch_points: DEVICE.touchPoints,
  user_agent: navigator.userAgent
});

const timeline = [];
timeline.push({
  type: TextPlugin, button: "次へ",
  html: `${demoMode ? `<p class="dim-label">デモモード：データは送信されず、最後に画面に表示されます。</p>` : ""}${CONFIG.INFO}`
});

// 参加者ごとの組み合わせ（順序 VA/AV × 語のリスト A/B）のタイムラインを4通り作っておき、該当する1つだけを実行する
function buildBlocks(code, list) {
  const tl = [];
  const parts = [...ORDERS[code], "buildability"];
  // 3つのパートとも、割り当てられたリスト（約42語）だけを評定する
  const plan = parts.map(dim => ({ dim, words: CONFIG.WORD_LISTS[list],
    catches: jsPsych.randomization.shuffle(CONFIG.CATCH).slice(0, CONFIG.CATCH_PER_PART) }));
  const TOTAL = plan.reduce((n, p) => n + p.words.length + p.catches.length, 0);
  let done = 0;
  plan.forEach(({ dim, words: wordList, catches: catchList }, bi) => {
    const d = CONFIG.DIMENSIONS[dim];
    const isBuild = dim === "buildability";
    tl.push({
      type: TextPlugin, button: "練習をはじめる",
      html: `<h1>パート${bi + 1}／${parts.length}${isBuild ? "（最後のパートです）" : ""}</h1>
        ${isBuild ? buildInstruction() : d.opening[bi === 0 ? "first" : "second"] + d.body}
        <p>はじめに、${CONFIG.PRACTICE.length}つの言葉で練習をします。</p>
        ${DEVICE.type === "pc" ? `<p>数字はマウスでクリックするほか、キーボードの <strong>1〜9キー</strong>でも選べます。<strong>Enterキー</strong>で次へ進みます。</p>` : ""}`
    });
    jsPsych.randomization.shuffle(CONFIG.PRACTICE).forEach((w, pi) => tl.push({
      type: RatingPlugin, word: w, dimension: dim, isPractice: true,
      data: { block: bi + 1, trial_in_block: pi + 1, task: "practice" }
    }));
    tl.push({
      type: TextPlugin, button: "本番をはじめる",
      html: `<h1>練習は終わりです</h1><p>ここから本番です。練習と同じように、<strong>${d.name}</strong>を評定してください。</p>`
    });
    // 単語試行とキャッチ試行を混ぜる。キャッチは区間ごとに1問ずつ散らす（各区間の先頭3試行は避ける）
    const items = jsPsych.randomization.shuffle(wordList).map(w => ({ kind: "rating", word: w }));
    const catches = jsPsych.randomization.shuffle(catchList);
    const seg = Math.floor(items.length / catches.length);
    for (let k = catches.length - 1; k >= 0; k--) {
      const pos = k * seg + 3 + Math.floor(Math.random() * (seg - 3));
      items.splice(pos, 0, { kind: "catch", ...catches[k] });
    }
    items.forEach((it, wi) => tl.push(it.kind === "rating" ? {
      type: RatingPlugin, word: it.word, dimension: dim,
      progress: (done + wi) / TOTAL,
      data: { block: bi + 1, trial_in_block: wi + 1, task: "rating" }
    } : {
      type: RatingPlugin, word: it.text, isCatch: true, dimension: dim,
      progress: (done + wi) / TOTAL,
      data: { block: bi + 1, trial_in_block: wi + 1, task: "catch", catch_id: it.id, correct_answer: it.answer },
      on_finish: d => { d.catch_correct = d.rating === d.correct_answer; }
    }));
    done += items.length;
    if (bi < parts.length - 1) tl.push({
      type: TextPlugin, button: `パート${bi + 2}へ進む`,
      html: `<h1>パート${bi + 1}が終わりました</h1><p>少し休憩してから、次のパートに進んでください。${bi + 2 === parts.length ? "次が最後のパートです。" : ""}</p>`,
      // 途中離脱に備えて、パート1の時点で一度保存する（失敗しても先に進める）
      on_start: () => { if (!demoMode && bi === 0) saveData("part1"); }
    });
  });
  return tl;
}
timeline.push({ type: ConsentPlugin });
timeline.push({ type: SurveyPlugin });

["VA", "AV"].forEach(code => ["A", "B"].forEach(list => timeline.push({
  timeline: buildBlocks(code, list),
  conditional_function: () => order.code === code && order.list === list
})));

/* データ保存（DataPipe → Google ドライブ） */
async function saveData(label = "complete") {
  const csv = jsPsych.data.get().filter([{ task: "rating" }, { task: "catch" }])
    .ignore(["trial_type", "plugin_version", "internal_node_id", "time_elapsed"]).csv();
  if (demoMode) return { ok: true, csv };
  try {
    const res = await fetch("https://pipe.jspsych.org/api/data/", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "*/*" },
      body: JSON.stringify({
        experimentID: CONFIG.DATAPIPE_ID,
        filename: `${participantId}_${label}_${Date.now()}.csv`,
        data: csv
      })
    });
    return { ok: res.ok, csv };
  } catch (e) { return { ok: false, csv }; }
}

function catchSummary() {
  const c = jsPsych.data.get().filter({ task: "catch" });
  return `${c.filter({ catch_correct: true }).count()} / ${c.count()}`;
}

timeline.push({
  type: class {
    static info = { name: "finish", version: "1.0.0", parameters: {}, data: {} };
    constructor(jsPsych) { this.jsPsych = jsPsych; }
    // jsPsych 8 では trial() が Promise を返すと、解決した時点で試行（＝実験）が終わり画面が消える。
    // 終了画面を残すため、保存処理は別の async 関数で行い、trial() 自体は何も返さない
    trial(el) { this.show(el); }
    async show(el) {
      el.innerHTML = `<div class="text"><p class="center">データを保存しています…</p></div>`;
      const r = await saveData();
      if (demoMode) {
        el.innerHTML = `<div class="result">
          <h1 style="font-size:22px;margin:0">デモ終了</h1>
          <p style="margin:0">本番では、このCSVがGoogle ドライブに自動保存されます。</p>
          <p style="margin:0">キャッチ試行の正答：<strong>${catchSummary()}</strong></p>
          <pre id="csv"></pre>
          <div><button class="btn" id="copy" type="button">CSVをコピー</button> <span id="msg" class="progress"></span></div>
        </div>`;
        el.querySelector("#csv").textContent = r.csv;
        el.querySelector("#copy").addEventListener("click", () => {
          navigator.clipboard.writeText(r.csv)
            .then(() => el.querySelector("#msg").textContent = "コピーしました")
            .catch(() => {
              const range = document.createRange(); range.selectNodeContents(el.querySelector("#csv"));
              const s = getSelection(); s.removeAllRanges(); s.addRange(range);
              el.querySelector("#msg").textContent = "選択した状態です。Ctrl+C／⌘+Cでコピーしてください";
            });
        });
      } else if (r.ok) {
        el.innerHTML = `<div class="text"><h1 style="text-align:center;font-size:28px;font-weight:500">ご協力ありがとうございました</h1><p style="text-align:center">回答は保存されました。このウィンドウを閉じてください。</p></div>`;
      } else {
        el.innerHTML = `<div class="text"><h1>保存に失敗しました</h1>
          <p>通信エラーで回答を保存できませんでした。ウィンドウを閉じずに、下のボタンでもう一度お試しください。</p>
          <div class="center"><button class="btn" id="retry" type="button">もう一度保存する</button></div></div>`;
        el.querySelector("#retry").addEventListener("click", () => this.show(el));
      }
    }
  }
});

// 順序を決めてから実験を開始する
(async () => {
  order = await assignOrder();
  jsPsych.data.addProperties({ block_order: order.code, build_list: order.list, order_source: order.source });
  jsPsych.run(timeline);
})();
</script>
